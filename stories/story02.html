<main><article class="story-article"><header class="story-article-header"><p class="section-label">ESSAY · 02</p><h1>천천히 걷는 사람</h1><p class="story-date">2026.09</p></header><div class="story-body"><p>사람들은 빠르게 걷는다.</p><p>목적지가 있고, 시간이 정해져 있기 때문이다.</p><p>하지만 가끔은 아무런 이유 없이 천천히 걸어도 좋다.</p><p>길가의 나무를 보고, 지나가는 사람을 보고, 햇빛이 바뀌는 것을 바라본다.</p><p>목적지가 없는 걸음도 충분히 하나의 이야기가 될 수 있으니까.</p></div></article></main>
