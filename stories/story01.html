<main><article class="story-article"><header class="story-article-header"><p class="section-label">ESSAY · 01</p><h1>오래된 의자에 앉아서</h1><p class="story-date">2026.09</p></header><div class="story-body"><p>오래된 의자가 하나 있다.</p><p>매일 지나치는 자리라서 그 존재를 특별하게 생각해본 적은 없었다.</p><p>어느 날 그 의자에 앉았다.</p><p>이상하게도 평소와 다른 풍경이 보였다.</p><p>같은 장소인데, 앉아서 바라보니 조금 느려졌다.</p><p>어쩌면 우리가 놓치는 것은 새로운 것이 아니라 너무 익숙해서 보이지 않는 것인지도 모른다.</p></div></article></main>
